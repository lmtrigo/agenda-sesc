name: Redirecionar para o endereço novo

# Este repositório aposentou-se. O app mudou para
# https://acontece-no-sesc.github.io/ e aqui só fica uma página que leva
# até lá, preservando o caminho de quem tinha um link salvo.
#
# O robô de coleta saiu daqui de propósito: ele rodava toda madrugada e
# republicava um site inteiro, o que sobrescreveria o redirecionamento no dia
# seguinte — e ainda deixaria duas cópias do mesmo app no ar, coletando o
# mesmo portal duas vezes.
#
# Só roda quando alguém aperta o botão: assim o site antigo continua de pé
# até a hora que você decidir virar a chave.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar a página
        run: |
          mkdir -p site
          cp redirecionamento.html site/index.html
          # O mesmo arquivo como 404: é ele que atende QUALQUER caminho antigo
          # (/dados/ics/123.ics, /programacao, o que for) e é lá que o script
          # recorta o prefixo e recola o resto no endereço novo.
          cp redirecionamento.html site/404.html

          # O worker de despedida vai para o MESMO caminho do antigo
          # (/agenda-sesc/sw.js). É a única coisa que o navegador busca
          # sozinho num PWA já instalado: sem ele, quem instalou continua
          # abrindo a casca em cache do app velho para sempre.
          cp sw-despedida.js site/sw.js

          # O manifest volta a existir só para o app instalado não ficar sem
          # identidade enquanto o navegador não o descarta.
          cp manifest-despedida.webmanifest site/manifest.webmanifest

          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
